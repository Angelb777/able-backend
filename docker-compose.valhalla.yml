services:
  valhalla:
    build:
      context: ./infra/valhalla
      dockerfile: Dockerfile
    image: able73-valhalla:es-panama
    container_name: able73-valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./infra/valhalla/custom_files:/custom_files
    environment:
      path_extension: es-panama-v1
      serve_tiles: "True"
      use_tiles_ignore_pbf: "False"
      force_rebuild: "False"
      build_tar: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      update_existing_config: "True"
      server_threads: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60m
    deploy:
      resources:
        limits:
          memory: 8G
