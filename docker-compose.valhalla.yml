services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    container_name: able73-valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./infra/valhalla/custom_files:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/europe/spain/aragon-latest.osm.pbf
      serve_tiles: "True"
      use_tiles_ignore_pbf: "False"
      force_rebuild: "False"
      build_tar: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      update_existing_config: "True"
      server_threads: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20m
    deploy:
      resources:
        limits:
          memory: 4G
